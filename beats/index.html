<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEATS — vertical tracker</title>
<style>
  :root {
    --bg:        #15151f;
    --panel:     #1e1e2e;
    --panel-hi:  #2a2a40;
    --grid:      #2c2c44;
    --row-beat:  #232338;
    --row-bar:   #2b2b4a;
    --text:      #c8c8e0;
    --dim:       #56567a;
    --accent:    #3fe0c5;
    --cursor:    #ffcc44;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Consolas", "Menlo", "DejaVu Sans Mono", monospace;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 12px 40px;
  }
  header {
    text-align: center;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 8px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(63,224,197,0.45);
  }
  .tagline {
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* ---- transport ---- */
  .transport {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 16px;
  }
  .ctrl { display: flex; flex-direction: column; gap: 4px; }
  .ctrl label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--dim);
    text-transform: uppercase;
  }
  .ctrl .value { font-size: 12px; color: var(--accent); min-width: 30px; }
  button {
    font-family: inherit;
    background: var(--panel-hi);
    color: var(--text);
    border: 1px solid var(--grid);
    border-radius: 5px;
    padding: 9px 16px;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .1s, border-color .1s;
  }
  button:hover { background: var(--grid); }
  button.play {
    min-width: 84px;
    font-weight: bold;
    border-color: var(--accent);
    color: var(--accent);
  }
  button.play.playing {
    background: var(--accent);
    color: var(--bg);
  }
  input[type=range] { width: 120px; accent-color: var(--accent); cursor: pointer; }

  /* ---- tracker grid ---- */
  .tracker {
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 8px;
    padding: 10px;
    overflow: hidden;
  }
  .head-row, .step-row { display: flex; align-items: stretch; }
  .corner, .rownum {
    width: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--dim);
  }
  .head-cell {
    width: 64px;
    margin: 0 2px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 6px 0;
    border-radius: 4px 4px 0 0;
    font-weight: bold;
  }
  .head-row { margin-bottom: 4px; }

  .step-row { padding: 1px 0; border-radius: 3px; }
  .step-row.beat { background: var(--row-beat); }
  .step-row.bar  { background: var(--row-bar); }
  .step-row.cursor { background: rgba(255,204,68,0.14); box-shadow: inset 0 0 0 1px rgba(255,204,68,0.5); }
  .rownum.cursor-num { color: var(--cursor); }

  .cell {
    width: 64px;
    height: 26px;
    margin: 1px 2px;
    background: var(--grid);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--dim);
    cursor: pointer;
    transition: background .05s, box-shadow .05s;
  }
  .cell:hover { box-shadow: inset 0 0 0 1px var(--dim); }
  .cell.on {
    color: #11111a;
    font-weight: bold;
  }
  .cell.on.accent { box-shadow: inset 0 0 0 2px #fff6; }
  .cell.flash { box-shadow: 0 0 10px 1px currentColor; }

  footer { color: var(--dim); font-size: 11px; margin-top: 16px; text-align: center; line-height: 1.6; }
  kbd {
    background: var(--panel-hi); border: 1px solid var(--grid);
    border-radius: 3px; padding: 1px 5px; font-size: 10px; color: var(--text);
  }
</style>
</head>
<body>
  <header>
    <h1>BEATS</h1>
    <div class="tagline">vertical step tracker &middot; inspired by Fast Tracker 2</div>
  </header>

  <div class="transport">
    <button id="play" class="play">▶ PLAY</button>
    <div class="ctrl">
      <label>Tempo <span class="value" id="bpmVal">120</span></label>
      <input type="range" id="bpm" min="60" max="200" value="120">
    </div>
    <div class="ctrl">
      <label>Swing <span class="value" id="swingVal">0%</span></label>
      <input type="range" id="swing" min="0" max="60" value="0">
    </div>
    <div class="ctrl">
      <label>Volume <span class="value" id="volVal">80</span></label>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
    <button id="clear">CLEAR</button>
  </div>

  <div class="tracker" id="tracker"></div>

  <footer>
    Click cells to toggle hits &middot; <kbd>Shift</kbd>+click for accent &middot; <kbd>Space</kbd> to play/stop<br>
    8 channels &middot; 16 steps &middot; all sound synthesized live in your browser
  </footer>

<script>
"use strict";

/* ============================================================
   Channels — each has a short label, a colour, and a synth fn.
   ============================================================ */
const CHANNELS = [
  { id:"kick",  name:"KICK", color:"#ff5d73", synth: kick     },
  { id:"snare", name:"SNR",  color:"#ffb454", synth: snare    },
  { id:"hhc",   name:"HHC",  color:"#3fe0c5", synth: hatClosed },
  { id:"hho",   name:"HHO",  color:"#46c6ff", synth: hatOpen  },
  { id:"clap",  name:"CLAP", color:"#c98bff", synth: clap     },
  { id:"tom",   name:"TOM",  color:"#7d8bff", synth: tom      },
  { id:"rim",   name:"RIM",  color:"#9affb0", synth: rim      },
  { id:"cow",   name:"COW",  color:"#ffe26b", synth: cowbell  },
];
const NUM_STEPS = 16;

/* pattern[step][channel] = 0 | 1 (hit) | 2 (accent) */
let pattern = Array.from({length:NUM_STEPS}, () => new Array(CHANNELS.length).fill(0));

/* ============================================================
   Audio engine (Web Audio, all synthesized)
   ============================================================ */
let ctx = null;
let master = null;
let noiseBuffer = null;

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = 0.8;
  master.connect(ctx.destination);

  // pre-render a buffer of white noise for percussion
  const len = ctx.sampleRate * 1;
  noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
}

function noiseSource() {
  const s = ctx.createBufferSource();
  s.buffer = noiseBuffer;
  return s;
}

// gain envelope helper
function env(node, t, peak, decay) {
  node.gain.setValueAtTime(0.0001, t);
  node.gain.exponentialRampToValueAtTime(peak, t + 0.002);
  node.gain.exponentialRampToValueAtTime(0.0001, t + decay);
}

function kick(t, gain) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.11);
  env(g, t, 1.0 * gain, 0.42);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.45);
}

function snare(t, gain) {
  const n = noiseSource(), nf = ctx.createBiquadFilter(), ng = ctx.createGain();
  nf.type = "highpass"; nf.frequency.value = 1500;
  env(ng, t, 0.7 * gain, 0.2);
  n.connect(nf).connect(ng).connect(master); n.start(t); n.stop(t + 0.2);

  const o = ctx.createOscillator(), og = ctx.createGain();
  o.type = "triangle"; o.frequency.value = 185;
  env(og, t, 0.5 * gain, 0.11);
  o.connect(og).connect(master); o.start(t); o.stop(t + 0.12);
}

function hat(t, gain, dur, level) {
  const n = noiseSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = "highpass"; f.frequency.value = 8000;
  env(g, t, level * gain, dur);
  n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + 0.02);
}
function hatClosed(t, g) { hat(t, g, 0.045, 0.45); }
function hatOpen(t, g)   { hat(t, g, 0.32, 0.4); }

function clap(t, gain) {
  const f = ctx.createBiquadFilter();
  f.type = "bandpass"; f.frequency.value = 1200; f.Q.value = 1.2;
  f.connect(master);
  [0, 0.012, 0.024, 0.05].forEach((off, i) => {
    const n = noiseSource(), g = ctx.createGain();
    const d = i === 3 ? 0.18 : 0.03;
    env(g, t + off, (i === 3 ? 0.5 : 0.7) * gain, d);
    n.connect(g).connect(f); n.start(t + off); n.stop(t + off + d + 0.02);
  });
}

function tom(t, gain) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
  env(g, t, 0.8 * gain, 0.3);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.32);
}

function rim(t, gain) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square"; o.frequency.value = 1700;
  env(g, t, 0.35 * gain, 0.03);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.04);
}

function cowbell(t, gain) {
  const f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = "bandpass"; f.frequency.value = 560; f.Q.value = 1.5;
  env(g, t, 0.4 * gain, 0.3);
  f.connect(g).connect(master);
  [540, 800].forEach(freq => {
    const o = ctx.createOscillator();
    o.type = "square"; o.frequency.value = freq;
    o.connect(f); o.start(t); o.stop(t + 0.32);
  });
}

/* ============================================================
   Sequencer — Web Audio lookahead scheduler
   ============================================================ */
let isPlaying = false;
let bpm = 120;
let swing = 0;        // 0..0.6 of a step
let currentStep = 0;
let nextNoteTime = 0;
let timerId = null;
const LOOKAHEAD = 25;          // ms between scheduler ticks
const SCHEDULE_AHEAD = 0.1;    // s of audio scheduled in advance
const stepQueue = [];          // {step, time} for visual sync

function stepDuration() { return (60 / bpm) / 4; } // 16th notes

function advance() {
  // swing: delay every odd (off-beat) 16th
  const base = stepDuration();
  const isOff = (currentStep % 2) === 1;
  nextNoteTime += isOff ? base * (1 - swing) : base * (1 + swing);
  currentStep = (currentStep + 1) % NUM_STEPS;
}

function scheduleStep(step, time) {
  for (let c = 0; c < CHANNELS.length; c++) {
    const v = pattern[step][c];
    if (v) CHANNELS[c].synth(time, v === 2 ? 1.0 : 0.62);
  }
  stepQueue.push({ step, time });
}

function scheduler() {
  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
    scheduleStep(currentStep, nextNoteTime);
    advance();
  }
  timerId = setTimeout(scheduler, LOOKAHEAD);
}

function play() {
  initAudio();
  if (ctx.state === "suspended") ctx.resume();
  isPlaying = true;
  currentStep = 0;
  nextNoteTime = ctx.currentTime + 0.05;
  scheduler();
  requestAnimationFrame(drawCursor);
  playBtn.classList.add("playing");
  playBtn.textContent = "■ STOP";
}

function stop() {
  isPlaying = false;
  clearTimeout(timerId);
  stepQueue.length = 0;
  playBtn.classList.remove("playing");
  playBtn.textContent = "▶ PLAY";
  setCursor(-1);
}

/* ============================================================
   UI / rendering
   ============================================================ */
const tracker = document.getElementById("tracker");
const playBtn = document.getElementById("play");
const cellEls = [];   // cellEls[step][channel]
let rowEls = [];      // step row containers
let rowNumEls = [];

function hex(n) { return n.toString(16).toUpperCase().padStart(2, "0"); }

function buildGrid() {
  tracker.innerHTML = "";
  cellEls.length = 0; rowEls = []; rowNumEls = [];

  // header
  const head = document.createElement("div");
  head.className = "head-row";
  const corner = document.createElement("div");
  corner.className = "corner";
  head.appendChild(corner);
  CHANNELS.forEach(ch => {
    const h = document.createElement("div");
    h.className = "head-cell";
    h.textContent = ch.name;
    h.style.color = ch.color;
    h.style.background = "rgba(255,255,255,0.04)";
    head.appendChild(h);
  });
  tracker.appendChild(head);

  // step rows
  for (let s = 0; s < NUM_STEPS; s++) {
    const row = document.createElement("div");
    row.className = "step-row";
    if (s % 4 === 0) row.classList.add("beat");
    if (s % 8 === 0) row.classList.add("bar");

    const num = document.createElement("div");
    num.className = "rownum";
    num.textContent = hex(s);
    row.appendChild(num);
    rowNumEls.push(num);

    const rowCells = [];
    CHANNELS.forEach((ch, c) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.step = s;
      cell.dataset.chan = c;
      cell.addEventListener("mousedown", onCellDown);
      row.appendChild(cell);
      rowCells.push(cell);
    });
    cellEls.push(rowCells);
    rowEls.push(row);
    tracker.appendChild(row);
  }
  refreshCells();
}

function refreshCells() {
  for (let s = 0; s < NUM_STEPS; s++) {
    for (let c = 0; c < CHANNELS.length; c++) {
      const v = pattern[s][c];
      const cell = cellEls[s][c];
      cell.classList.toggle("on", v > 0);
      cell.classList.toggle("accent", v === 2);
      if (v > 0) {
        cell.style.background = CHANNELS[c].color;
        cell.style.color = "#11111a";
        cell.textContent = v === 2 ? "●" : "●";
      } else {
        cell.style.background = "";
        cell.style.color = "";
        cell.textContent = "·";
      }
    }
  }
}

function onCellDown(e) {
  const s = +e.currentTarget.dataset.step;
  const c = +e.currentTarget.dataset.chan;
  const cur = pattern[s][c];
  let next;
  if (e.shiftKey) {
    next = cur === 2 ? 0 : 2;           // shift = toggle accent
  } else {
    next = cur ? 0 : 1;                 // plain = toggle hit
  }
  pattern[s][c] = next;
  const cell = cellEls[s][c];
  cell.classList.toggle("on", next > 0);
  cell.classList.toggle("accent", next === 2);
  if (next > 0) {
    cell.style.background = CHANNELS[c].color;
    cell.style.color = "#11111a";
    cell.textContent = "●";
    // audition the sound
    initAudio();
    if (ctx.state === "suspended") ctx.resume();
    CHANNELS[c].synth(ctx.currentTime, next === 2 ? 1.0 : 0.62);
  } else {
    cell.style.background = "";
    cell.style.color = "";
    cell.textContent = "·";
  }
}

/* cursor / playhead */
let displayedStep = -1;
function setCursor(step) {
  if (displayedStep === step) return;
  if (displayedStep >= 0) {
    rowEls[displayedStep].classList.remove("cursor");
    rowNumEls[displayedStep].classList.remove("cursor-num");
  }
  if (step >= 0) {
    rowEls[step].classList.add("cursor");
    rowNumEls[step].classList.add("cursor-num");
    // flash the active cells in this row
    for (let c = 0; c < CHANNELS.length; c++) {
      if (pattern[step][c] > 0) {
        const cell = cellEls[step][c];
        cell.classList.add("flash");
        setTimeout(() => cell.classList.remove("flash"), 90);
      }
    }
  }
  displayedStep = step;
}

function drawCursor() {
  if (!isPlaying) return;
  const now = ctx.currentTime;
  while (stepQueue.length && stepQueue[0].time <= now) {
    setCursor(stepQueue.shift().step);
  }
  requestAnimationFrame(drawCursor);
}

/* ============================================================
   Controls
   ============================================================ */
playBtn.addEventListener("click", () => isPlaying ? stop() : play());

const bpmInput = document.getElementById("bpm");
const bpmVal = document.getElementById("bpmVal");
bpmInput.addEventListener("input", () => { bpm = +bpmInput.value; bpmVal.textContent = bpm; });

const swingInput = document.getElementById("swing");
const swingVal = document.getElementById("swingVal");
swingInput.addEventListener("input", () => {
  swing = (+swingInput.value) / 100;
  swingVal.textContent = swingInput.value + "%";
});

const volInput = document.getElementById("vol");
const volVal = document.getElementById("volVal");
volInput.addEventListener("input", () => {
  volVal.textContent = volInput.value;
  if (master) master.gain.value = (+volInput.value) / 100;
});

document.getElementById("clear").addEventListener("click", () => {
  pattern = Array.from({length:NUM_STEPS}, () => new Array(CHANNELS.length).fill(0));
  refreshCells();
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target.tagName !== "INPUT") {
    e.preventDefault();
    isPlaying ? stop() : play();
  }
});

/* ============================================================
   Demo pattern so it's not empty on first load
   ============================================================ */
function loadDemo() {
  const set = (chan, steps, v=1) => steps.forEach(s => pattern[s][idx(chan)] = v);
  const idx = id => CHANNELS.findIndex(c => c.id === id);
  set("kick",  [0, 6, 8, 14], 2);
  set("snare", [4, 12], 2);
  set("hhc",   [0,2,4,6,8,10,12,14]);
  set("hho",   [7, 15]);
  set("clap",  [4, 12]);
  refreshCells();
}

buildGrid();
loadDemo();
</script>
</body>
</html>
