<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060d">
  <title>Tilt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #05060d;
      --ink: #e8ecff;
      --ink-dim: rgba(232, 236, 255, 0.55);
      --line: rgba(232, 236, 255, 0.15);
      --chip: rgba(5, 6, 13, 0.5);
      --accent: #5ef0ff;
      --accent-2: #ff5fb4;
    }

    body[data-theme="light"] {
      --ink: #1b1d2e;
      --ink-dim: rgba(27, 29, 46, 0.6);
      --line: rgba(27, 29, 46, 0.18);
      --chip: rgba(241, 236, 225, 0.6);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', ui-monospace, monospace;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: none;
      overscroll-behavior: none;
      transition: background-color 0.4s ease;
    }

    canvas { display: block; position: fixed; inset: 0; touch-action: none; }

    #start {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 60%, rgba(30, 40, 110, 0.35), transparent 70%);
      transition: opacity 0.6s ease;
      z-index: 3;
    }
    #start.gone { opacity: 0; pointer-events: none; }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: clamp(64px, 22vw, 140px);
      letter-spacing: -0.04em;
      line-height: 0.9;
      background: linear-gradient(160deg, var(--accent) 10%, #8a7dff 50%, var(--accent-2) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transform: rotate(-6deg);
    }

    #start p {
      max-width: 22em;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(232, 236, 255, 0.55);
    }

    #go {
      font-family: 'Unbounded', sans-serif;
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 0.08em;
      color: #e8ecff;
      background: rgba(94, 240, 255, 0.08);
      border: 1px solid rgba(94, 240, 255, 0.5);
      border-radius: 999px;
      padding: 16px 36px;
      cursor: pointer;
      box-shadow: 0 0 40px rgba(94, 240, 255, 0.15);
    }
    #go:active { transform: scale(0.97); }

    #modes {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      padding: 3px;
      max-width: calc(100vw - 24px);
      overflow-x: auto;
      scrollbar-width: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--chip);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 2;
    }
    #modes.show { opacity: 1; pointer-events: auto; }
    #modes::-webkit-scrollbar { display: none; }

    #modes button {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
      font: inherit;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-dim);
      background: none;
      border: 0;
      border-radius: 999px;
      padding: 8px 9px;
      cursor: pointer;
    }
    #modes button::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dot);
    }
    @media (max-width: 440px) {
      #modes {
        flex-wrap: wrap;
        justify-content: center;
        width: calc(100vw - 24px);
        border-radius: 20px;
      }
      #modes button { padding: 7px 8px; }
      #modes button::before { display: none; }
    }
    #modes button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--line);
    }

    #modeName {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
      font-size: clamp(48px, 16vw, 120px);
      letter-spacing: -0.04em;
      color: var(--ink);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    #modeName.flash { animation: name-flash 1.4s ease forwards; }
    @keyframes name-flash {
      0% { opacity: 0; transform: scale(0.94); }
      20% { opacity: 0.85; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.04); }
    }

    #hints {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-dim);
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
      z-index: 1;
    }
    #hints.show { opacity: 1; }
    #hints span {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--chip);
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="start">
    <h1>Tilt</h1>
    <p>Boxes of stuff that move with your phone. Tilt to pour, twist to swirl, shake to scatter, touch to gather.</p>
    <button id="go">Tap to start</button>
  </div>
  <nav id="modes" aria-label="Mode"></nav>
  <div id="modeName"></div>
  <div id="hints"></div>

  <script type="module">
    import * as THREE from 'three';

    // ---- Modes -----------------------------------------------------------
    // Every mode runs the same simulation and input; each brings its own
    // physics feel, particle look (fragment shader) and backdrop.
    //   count     particles on desktop (touch devices get 65%)
    //   cells     pressure-grid resolution along the height; fewer particles need a coarser grid
    //   G         gravity strength (negative floats against gravity)
    //   fill      fraction of the box the settled particles occupy
    //   cohesion  0 = particles only push apart, >0 = they also pull together into blobs
    //   jitter    random wandering
    //   size      particle diameter in world units (box height is 2), sizeVar randomises it per particle
    //   speedRef  speed that counts as "fast" for colouring
    //   trail     0 = clear every frame, >0 = fade the previous frame by this much (long exposure)
    //   strand    if set, particles are threaded into strands of this many points, `segment` apart,
    //             held together by distance constraints; `stiffness` (0–1) resists bending
    //   vortex    how much a held finger swirls particles around it (default 2)
    //   align     particles carry an orientation (vAngle) that lines up with a magnet under the finger
    //   scenery   optional function returning a fixed Three.js object shown inside the box
    //   pop       particles are bubbles: touch and shakes pop them, and they grow back on the low side
    //   touchHint start-screen hint for what a touch does (default 'Touch to gather')
    const MODES = [
      {
        id: 'sand', name: 'Sand', dot: '#5ef0ff', bg: 0x05060d, theme: 'dark',
        count: 22000, cells: 40, G: 3.2, fill: 0.4, damp: 0.9, bounce: 0.35, swirl: 1.4, pull: 6,
        cohesion: 0, jitter: 0, burst: 1.6, size: 0.013, sizeVar: 0, speedRef: 2.2, trail: 0,
        box: [0x8fa0ff, 0.12], blend: 'add',
        frag: /* glsl */`
          void main() {
            float d = length(gl_PointCoord - 0.5);
            float a = smoothstep(0.5, 0.0, d);
            vec3 slow = vec3(0.24, 0.30, 0.95), mid = vec3(0.24, 0.94, 1.0), fast = vec3(1.0, 0.37, 0.71);
            vec3 c = vSpeed < 0.5 ? mix(slow, mid, vSpeed * 2.0) : mix(mid, fast, vSpeed * 2.0 - 1.0);
            gl_FragColor = vec4(c * (0.55 + 0.45 * vDepth) + uFlash, a * 0.8);
          }`,
      },
      {
        id: 'ink', name: 'Ink', dot: '#1d2a6b', bg: 0xf1ece1, theme: 'light',
        count: 12000, cells: 32, G: 2.0, fill: 0.35, damp: 2.0, bounce: 0.2, swirl: 2.0, pull: 5,
        cohesion: 0, jitter: 0.3, burst: 1.2, size: 0.04, sizeVar: 0.6, speedRef: 1.6, trail: 0.05,
        box: [0x1b1d2e, 0.15], blend: 'normal',
        frag: /* glsl */`
          void main() {
            float d = length(gl_PointCoord - 0.5);
            float a = smoothstep(0.5, 0.15, d);
            vec3 c = mix(vec3(0.06, 0.09, 0.25), vec3(0.85, 0.18, 0.12), smoothstep(0.35, 1.0, vSpeed + uFlash * 2.0));
            c = mix(c, vec3(0.94, 0.92, 0.88), (1.0 - vDepth) * 0.45);
            gl_FragColor = vec4(c, a * 0.3);
          }`,
      },
      {
        id: 'embers', name: 'Embers', dot: '#ff8a2a', bg: 0x0a0503, theme: 'dark',
        count: 3000, cells: 18, G: -0.8, fill: 0.4, damp: 1.5, bounce: 0.6, swirl: 1.8, pull: 4,
        cohesion: 0, jitter: 3.0, burst: 2.2, size: 0.028, sizeVar: 1, speedRef: 1.5, trail: 0.15,
        box: [0xff8a2a, 0.08], blend: 'add',
        frag: /* glsl */`
          void main() {
            float d = length(gl_PointCoord - 0.5);
            float core = exp(-d * d * 60.0), halo = exp(-d * d * 12.0) * 0.35;
            float tw = 0.55 + 0.45 * sin(uTime * (2.0 + vSeed * 6.0) + vSeed * 50.0);
            vec3 c = mix(vec3(1.0, 0.28, 0.04), vec3(1.0, 0.82, 0.45), clamp(vSpeed * 0.8 + tw * 0.3, 0.0, 1.0));
            float edge = smoothstep(0.5, 0.4, d);
            gl_FragColor = vec4((c * (core + halo) * (0.4 + tw) + uFlash * core) * edge * (0.5 + 0.5 * vDepth) * 0.3, 1.0);
          }`,
      },
      {
        id: 'mercury', name: 'Mercury', dot: '#c9d2dc', bg: 0x0b0d10, theme: 'dark',
        count: 9000, cells: 28, G: 3.5, fill: 0.3, damp: 1.6, bounce: 0.1, swirl: 1.2, pull: 7,
        cohesion: 0.06, jitter: 0, burst: 1.4, size: 0.04, sizeVar: 0.3, speedRef: 2.0, trail: 0,
        box: [0xc9d2dc, 0.1], blend: 'opaque',
        frag: /* glsl */`
          void main() {
            vec2 p = gl_PointCoord * 2.0 - 1.0;
            p.y = -p.y;
            float r2 = dot(p, p);
            if (r2 > 1.0) discard;
            vec3 n = vec3(p, sqrt(1.0 - r2));
            vec3 r = reflect(vec3(0.0, 0.0, -1.0), n);
            // Fake studio environment: dark floor, bright sky, one hard key light.
            vec3 env = mix(vec3(0.05, 0.06, 0.08), vec3(0.92, 0.95, 1.0), smoothstep(-0.1, 0.6, r.y));
            env += pow(max(dot(r, normalize(vec3(-0.5, 0.7, 0.5))), 0.0), 60.0) * 1.6;
            env *= mix(vec3(1.0), vec3(1.0, 0.8, 0.62), vSpeed * 0.8);
            gl_FragColor = vec4(env * (0.45 + 0.55 * vDepth) + uFlash, 1.0);
          }`,
      },
      {
        id: 'confetti', name: 'Confetti', dot: '#ffd23f', bg: 0x14121c, theme: 'dark',
        count: 5000, cells: 24, G: 1.6, fill: 0.35, damp: 2.2, bounce: 0.2, swirl: 2.0, pull: 5,
        cohesion: 0, jitter: 1.0, burst: 2.0, size: 0.04, sizeVar: 0.4, speedRef: 1.5, trail: 0,
        box: [0xffffff, 0.08], blend: 'opaque',
        frag: /* glsl */`
          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float spinDir = vSeed > 0.5 ? 1.0 : -1.0;
            float ang = vSeed * 6.283 + uTime * (1.0 + vSeed * 2.0 + vSpeed * 4.0) * spinDir;
            float cs = cos(ang), sn = sin(ang);
            p = mat2(cs, -sn, sn, cs) * p;
            float flip = cos(uTime * (2.0 + fract(vSeed * 7.0) * 4.0) + vSeed * 30.0);
            if (abs(p.x) > 0.4 || abs(p.y) > 0.24 * abs(flip) + 0.02) discard;
            float k = floor(fract(vSeed * 13.0) * 5.0);
            vec3 c = k < 1.0 ? vec3(1.0, 0.82, 0.25)
                   : k < 2.0 ? vec3(1.0, 0.36, 0.45)
                   : k < 3.0 ? vec3(0.3, 0.8, 0.95)
                   : k < 4.0 ? vec3(0.55, 0.9, 0.45)
                   : vec3(0.75, 0.55, 1.0);
            c *= (0.5 + 0.5 * abs(flip)) * (flip > 0.0 ? 1.0 : 0.75);
            gl_FragColor = vec4(c * (0.55 + 0.45 * vDepth) + uFlash, 1.0);
          }`,
      },
      {
        id: 'string', name: 'String', dot: '#e07a4f', bg: 0x1a1614, theme: 'dark',
        count: 5000, strand: 80, segment: 0.018, stiffness: 0.15,
        cells: 24, G: 3.0, fill: 0.35, damp: 1.2, bounce: 0, swirl: 1.6, pull: 5,
        cohesion: 0, jitter: 0, burst: 1.2, size: 0.036, sizeVar: 0, speedRef: 2.0, trail: 0,
        box: [0xe8d9c4, 0.08], blend: 'opaque',
        frag: /* glsl */`
          float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
          void main() {
            vec2 p = gl_PointCoord * 2.0 - 1.0;
            p.y = -p.y;
            float r2 = dot(p, p);
            // Ragged edge so the yarn looks fuzzy rather than like a smooth tube.
            if (r2 > 0.7 + 0.3 * hash(floor(gl_FragCoord.xy) + vSeed * 97.0)) discard;
            vec3 n = vec3(p, sqrt(max(0.0, 1.0 - r2)));
            float k = floor(vSeed * 7.0);
            vec3 c = k < 1.0 ? vec3(0.80, 0.33, 0.20)
                   : k < 2.0 ? vec3(0.86, 0.66, 0.24)
                   : k < 3.0 ? vec3(0.18, 0.50, 0.52)
                   : k < 4.0 ? vec3(0.90, 0.84, 0.72)
                   : k < 5.0 ? vec3(0.50, 0.24, 0.40)
                   : k < 6.0 ? vec3(0.85, 0.50, 0.55)
                   : vec3(0.52, 0.62, 0.42);
            float light = max(dot(n, normalize(vec3(-0.4, 0.6, 0.7))), 0.0);
            c *= 0.5 + 0.6 * light;
            gl_FragColor = vec4(c * (0.55 + 0.45 * vDepth) + uFlash, 1.0);
          }`,
      },
      {
        id: 'snow', name: 'Snow', dot: '#dfe9f5', bg: 0x0e2238, theme: 'dark',
        count: 4000, cells: 24, G: 0.6, fill: 0.12, damp: 3.0, bounce: 0, swirl: 2.5, pull: 3,
        cohesion: 0, jitter: 0.6, burst: 2.5, size: 0.022, sizeVar: 0.8, speedRef: 0.8, trail: 0,
        box: [0xbfd8ff, 0.12], blend: 'normal',
        scenery: snowGlobeScene,
        frag: /* glsl */`
          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float r = length(p);
            float a = atan(p.y, p.x) + vSeed * 6.283 + uTime * (0.3 + vSeed * 0.5);
            // Bigger flakes get six arms; the rest are soft specks.
            float arms = 0.5 + 0.5 * abs(cos(3.0 * a));
            float edge = mix(0.3, 0.2 + 0.28 * arms, step(0.6, vSeed));
            float alpha = 1.0 - smoothstep(edge - 0.12, edge, r);
            vec3 c = mix(vec3(0.72, 0.82, 1.0), vec3(1.0), vDepth) + uFlash;
            gl_FragColor = vec4(c, alpha * (0.45 + 0.55 * vDepth));
          }`,
      },
      {
        id: 'iron', name: 'Iron', dot: '#3a3b40', bg: 0xe8e3d6, theme: 'light',
        count: 7000, cells: 30, G: 2.8, fill: 0.35, damp: 2.0, bounce: 0.1, swirl: 1.2, pull: 3,
        vortex: 0, align: true, touchHint: 'Touch for a magnet',
        cohesion: 0, jitter: 0, burst: 1.4, size: 0.036, sizeVar: 0.5, speedRef: 1.5, trail: 0,
        box: [0x2a2a2a, 0.15], blend: 'opaque',
        frag: /* glsl */`
          void main() {
            // Rotate into the needle's frame (point-sprite y runs down the screen).
            vec2 p = gl_PointCoord - 0.5;
            float cs = cos(vAngle), sn = sin(vAngle);
            vec2 q = vec2(cs * p.x - sn * p.y, sn * p.x + cs * p.y);
            float halfLen = 0.3 + 0.18 * vSeed;
            float halfWidth = 0.03 + 0.02 * fract(vSeed * 7.0);
            if (abs(q.x) > halfLen || abs(q.y) > halfWidth) discard;
            // A glint that comes and goes as the needle turns.
            float glint = pow(0.5 + 0.5 * sin(vAngle * 2.0 + 1.3), 3.0);
            vec3 c = mix(vec3(0.09, 0.09, 0.1), vec3(0.55, 0.56, 0.6), glint * (1.0 - abs(q.y) / halfWidth));
            gl_FragColor = vec4(c * (0.7 + 0.3 * vDepth) + uFlash, 1.0);
          }`,
      },
      {
        id: 'bubbles', name: 'Bubbles', dot: '#b48cff', bg: 0x0b0f1a, theme: 'dark',
        count: 600, cells: 16, G: -0.5, fill: 0.65, damp: 2.5, bounce: 0.3, swirl: 1.5, pull: 0,
        vortex: 0, pop: true, touchHint: 'Touch to pop',
        cohesion: 0, jitter: 0.4, burst: 1.0, size: 0.09, sizeVar: 0.8, speedRef: 1.0, trail: 0,
        box: [0xb48cff, 0.1], blend: 'add',
        frag: /* glsl */`
          void main() {
            vec2 p = gl_PointCoord * 2.0 - 1.0;
            p.y = -p.y;
            float r = length(p);
            if (r > 1.0) discard;
            // A soap film is nearly invisible face-on and bright toward the rim.
            float rim = smoothstep(0.72, 0.97, r) * (1.0 - smoothstep(0.97, 1.0, r));
            float a = r * r * r * 0.22 + rim * 0.55;
            // Iridescence: hue shifts with film thickness, which swirls slowly.
            float t = vSeed * 6.283 + uTime * 0.5 + atan(p.y, p.x) + r * 4.0;
            vec3 film = mix(vec3(1.0), 0.5 + 0.5 * cos(t + vec3(0.0, 2.1, 4.2)), 0.75);
            float highlight = 1.0 - smoothstep(0.0, 0.22, length(p - vec2(-0.4, 0.42)));
            vec3 c = film * a + highlight * 0.6;
            gl_FragColor = vec4(c * (0.6 + 0.4 * vDepth) + uFlash * rim, 1.0);
          }`,
      },
    ];

    // A snowy mound with three pines, sitting on the floor of the box.
    function snowGlobeScene() {
      const group = new THREE.Group();
      const moundHeight = 0.16, moundRadius = 0.5;
      const mound = new THREE.Mesh(
        new THREE.SphereGeometry(moundRadius, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0xdfe9f5 })
      );
      mound.scale.set(1, moundHeight / moundRadius, 0.55);
      mound.position.y = -HY;
      group.add(mound);

      const shades = [0x0f3130, 0x123b3a, 0x174645].map(c => new THREE.MeshBasicMaterial({ color: c }));
      const trunk = new THREE.MeshBasicMaterial({ color: 0x2b1d14 });
      for (const [x, z, h] of [[-0.17, -0.04, 0.6], [0.13, 0.07, 0.44], [0.32, -0.08, 0.3]]) {
        const base = -HY + moundHeight * Math.sqrt(Math.max(0, 1 - (x / moundRadius) ** 2)) - 0.02;
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.04, h * 0.05, h * 0.2, 8), trunk);
        stem.position.set(x, base + h * 0.1, z);
        group.add(stem);
        for (let k = 0; k < 3; k++) {
          const tier = new THREE.Mesh(new THREE.ConeGeometry(h * 0.32 * (1 - k * 0.25), h * 0.42, 12), shades[k]);
          tier.position.set(x, base + h * (0.32 + k * 0.22), z);
          group.add(tier);
        }
      }
      return group;
    }

    // ---- Settings -------------------------------------------------------
    const isTouch = matchMedia('(pointer: coarse)').matches;
    const countFor = m => {
      const c = Math.round(m.count * (isTouch ? 0.65 : 1));
      return m.strand ? Math.max(1, Math.floor(c / m.strand)) * m.strand : c;
    };
    const MAX_N = Math.max(...MODES.map(countFor));
    const HY = 1;            // box half-height (world units)
    const HZ = 0.3;          // box half-depth
    const SHAKE_THRESHOLD = 14; // m/s² of acceleration that counts as a shake

    // ---- Renderer & scene ----------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.autoClear = false;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);

    // Trail modes draw into a half-float buffer and fade it a little each frame
    // instead of clearing. An 8-bit buffer can't fade the last few levels, which
    // leaves permanent ghosts; half-float can. Both quads are raw shaders so the
    // colours match the particle shaders exactly (no colour-space conversion).
    const quadVertex = /* glsl */`
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;
    const fadeMaterial = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Vector3() }, uOpacity: { value: 1 } },
      vertexShader: quadVertex,
      fragmentShader: 'uniform vec3 uColor; uniform float uOpacity; void main() { gl_FragColor = vec4(uColor, uOpacity); }',
      transparent: true, depthTest: false, depthWrite: false,
    });
    const blitMaterial = new THREE.ShaderMaterial({
      uniforms: { tMap: { value: null } },
      vertexShader: quadVertex,
      fragmentShader: 'uniform sampler2D tMap; varying vec2 vUv; void main() { gl_FragColor = texture2D(tMap, vUv); }',
      depthTest: false, depthWrite: false,
    });
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fadeMaterial);
    quad.frustumCulled = false;
    const quadScene = new THREE.Scene();
    quadScene.add(quad);
    const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const trailTarget = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
    blitMaterial.uniforms.tMap.value = trailTarget.texture;

    function drawQuad(material, opacity) {
      quad.material = material;
      fadeMaterial.uniforms.uOpacity.value = opacity;
      renderer.render(quadScene, quadCamera);
    }

    let HX = 1;
    let nx, ny, nz, CSX, CSY, CSZ, rho, pressure, wallBoost;

    const positions = new Float32Array(MAX_N * 3);
    const vel = new Float32Array(MAX_N * 3);
    const speeds = new Float32Array(MAX_N);
    const seeds = new Float32Array(MAX_N);
    const prev = new Float32Array(MAX_N * 3);   // start-of-step positions, for strand velocities
    const angles = new Float32Array(MAX_N);     // needle orientation for `align` modes
    const scales = new Float32Array(MAX_N);     // per-particle size multiplier; bubbles regrow from 0

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
    geometry.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1).setUsage(THREE.DynamicDrawUsage));
    geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
    geometry.setAttribute('aAngle', new THREE.BufferAttribute(angles, 1).setUsage(THREE.DynamicDrawUsage));
    geometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1).setUsage(THREE.DynamicDrawUsage));

    // Shared by every mode's material, so updating one value updates whichever is active.
    const uniforms = {
      uSize: { value: 0.013 },
      uSizeVar: { value: 0 },
      uProj: { value: 1 },
      uHZ: { value: HZ },
      uTime: { value: 0 },
      uFlash: { value: 0 },
    };

    const vertexShader = /* glsl */`
      uniform float uSize;
      uniform float uSizeVar;
      uniform float uProj;
      uniform float uHZ;
      attribute float aSpeed;
      attribute float aSeed;
      attribute float aAngle;
      attribute float aScale;
      varying float vSpeed;
      varying float vSeed;
      varying float vDepth;
      varying float vAngle;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uSize * aScale * mix(1.0, 0.4 + aSeed * 1.2, uSizeVar) * uProj / -mv.z;
        vSpeed = aSpeed;
        vSeed = aSeed;
        vAngle = aAngle;
        vDepth = (position.z + uHZ) / (2.0 * uHZ);
      }
    `;
    const fragHeader = /* glsl */`
      uniform float uTime;
      uniform float uFlash;
      varying float vSpeed;
      varying float vSeed;
      varying float vDepth;
      varying float vAngle;
    `;

    const materials = new Map();
    function materialFor(m) {
      if (!materials.has(m.id)) {
        const opaque = m.blend === 'opaque';
        materials.set(m.id, new THREE.ShaderMaterial({
          uniforms,
          vertexShader,
          fragmentShader: fragHeader + m.frag,
          transparent: !opaque,
          depthWrite: opaque,
          blending: m.blend === 'add' ? THREE.AdditiveBlending : THREE.NormalBlending,
        }));
      }
      return materials.get(m.id);
    }

    const points = new THREE.Points(geometry);
    scene.add(points);

    let scenery = null;
    const sceneryCache = new Map();

    let boxLines = null;
    const boxMaterial = new THREE.LineBasicMaterial({ transparent: true });

    let mode = MODES[0];
    let n = 0;

    function setupGrid() {
      // Grid nodes sit exactly on the walls. A wall node only gathers density
      // from one side, so it's doubled per wall to stop particles sticking to edges.
      const cs = (2 * HY) / mode.cells;
      nx = Math.max(2, Math.round((2 * HX) / cs)) + 1;
      ny = mode.cells + 1;
      nz = Math.max(2, Math.round((2 * HZ) / cs)) + 1;
      CSX = (2 * HX) / (nx - 1); CSY = (2 * HY) / (ny - 1); CSZ = (2 * HZ) / (nz - 1);
      rho = new Float32Array(nx * ny * nz);
      pressure = new Float32Array(nx * ny * nz);
      wallBoost = new Float32Array(nx * ny * nz);
      for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        wallBoost[i + j * nx + k * nx * ny] =
          (i === 0 || i === nx - 1 ? 2 : 1) * (j === 0 || j === ny - 1 ? 2 : 1) * (k === 0 || k === nz - 1 ? 2 : 1);
      }
    }

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      HX = HY * camera.aspect;
      // Fit the front face of the box exactly to the screen.
      const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      camera.position.set(0, 0, HZ + HY / tanHalf);
      camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();
      // Pixels per world unit at distance 1, so particle sizes stay in world units.
      uniforms.uProj.value = (h * renderer.getPixelRatio()) / (2 * tanHalf);

      const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
      trailTarget.setSize(buf.x, buf.y);
      setupGrid();

      if (boxLines) { scene.remove(boxLines); boxLines.geometry.dispose(); }
      boxLines = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(2 * HX, 2 * HY, 2 * HZ)),
        boxMaterial
      );
      scene.add(boxLines);
      needsClear = true;
    }

    function spawn(from, to) {
      for (let i = from; i < to; i++) {
        positions[i * 3] = (Math.random() * 2 - 1) * HX;
        positions[i * 3 + 1] = (Math.random() * 2 - 1) * HY;
        positions[i * 3 + 2] = (Math.random() * 2 - 1) * HZ;
        vel[i * 3] = vel[i * 3 + 1] = vel[i * 3 + 2] = 0;
      }
    }

    // Strands start as gently wandering threads so the constraints don't snap them.
    function spawnStrands() {
      const L = mode.strand, seg = mode.segment;
      for (let s = 0; s * L < n; s++) {
        let x = (Math.random() * 2 - 1) * HX * 0.8, y = (Math.random() * 2 - 1) * HY * 0.8, z = (Math.random() * 2 - 1) * HZ * 0.8;
        let dx = Math.random() - 0.5, dy = Math.random() - 0.5, dz = Math.random() - 0.5;
        for (let j = 0; j < L; j++) {
          const p = (s * L + j) * 3;
          positions[p] = x; positions[p + 1] = y; positions[p + 2] = z;
          vel[p] = vel[p + 1] = vel[p + 2] = 0;
          dx += (Math.random() - 0.5) * 0.8; dy += (Math.random() - 0.5) * 0.8; dz += (Math.random() - 0.5) * 0.8;
          const len = Math.hypot(dx, dy, dz) || 1;
          dx /= len; dy /= len; dz /= len;
          if (Math.abs(x + dx * seg) > HX) dx = -dx;
          if (Math.abs(y + dy * seg) > HY) dy = -dy;
          if (Math.abs(z + dz * seg) > HZ) dz = -dz;
          x += dx * seg; y += dy * seg; z += dz * seg;
        }
      }
    }

    // Seeds drive per-particle variety in the shaders; strand modes share one per strand.
    function assignSeeds() {
      const L = mode.strand;
      let s = Math.random();
      for (let i = 0; i < n; i++) {
        if (!L) seeds[i] = Math.random();
        else if (i % L === 0) s = Math.random();
        if (L) seeds[i] = s;
      }
      for (let i = 0; i < n; i++) angles[i] = Math.random() * Math.PI;
      scales.fill(1);
      geometry.attributes.aSeed.needsUpdate = true;
      geometry.attributes.aAngle.needsUpdate = true;
      geometry.attributes.aScale.needsUpdate = true;
    }

    let needsClear = true;
    const modeButtons = new Map();

    function setMode(id, announce) {
      const next = MODES.find(m => m.id === id) || MODES[0];
      const prevN = n;
      mode = next;
      n = countFor(mode);
      // Particles carry over between modes; any extra ones start scattered.
      // Strands always start fresh, since loose particles can't be threaded.
      if (mode.strand) spawnStrands();
      else if (n > prevN) spawn(prevN, n);
      assignSeeds();
      geometry.setDrawRange(0, n);

      points.material = materialFor(mode);
      if (scenery) scene.remove(scenery);
      scenery = null;
      if (mode.scenery) {
        if (!sceneryCache.has(mode.id)) sceneryCache.set(mode.id, mode.scenery());
        scenery = sceneryCache.get(mode.id);
        scene.add(scenery);
      }
      uniforms.uSize.value = mode.size;
      uniforms.uSizeVar.value = mode.sizeVar;
      boxMaterial.color.set(mode.box[0]);
      boxMaterial.opacity = mode.box[1];
      renderer.setClearColor(mode.bg);
      fadeMaterial.uniforms.uColor.value.set((mode.bg >> 16 & 255) / 255, (mode.bg >> 8 & 255) / 255, (mode.bg & 255) / 255);
      const css = '#' + mode.bg.toString(16).padStart(6, '0');
      document.body.style.setProperty('--bg', css);
      document.querySelector('meta[name="theme-color"]').content = css;
      document.body.dataset.theme = mode.theme;
      setupGrid();
      needsClear = true;

      for (const [mid, btn] of modeButtons) btn.setAttribute('aria-pressed', String(mid === mode.id));
      modeButtons.get(mode.id)?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      history.replaceState(null, '', '#' + mode.id);

      if (announce) {
        const label = document.getElementById('modeName');
        label.textContent = mode.name;
        label.classList.remove('flash');
        void label.offsetWidth;   // restart the animation
        label.classList.add('flash');
      }
    }

    const nav = document.getElementById('modes');
    for (const m of MODES) {
      const btn = document.createElement('button');
      btn.textContent = m.name;
      btn.style.setProperty('--dot', m.dot);
      btn.addEventListener('click', () => { if (m.id !== mode.id) setMode(m.id, true); });
      nav.appendChild(btn);
      modeButtons.set(m.id, btn);
    }

    resize();
    setMode(location.hash.slice(1), false);
    addEventListener('resize', resize);

    // ---- Input: tilt, twist, shake, touch ------------------------------
    const gTarget = new THREE.Vector3(0, -1, -0.3).normalize();
    const g = gTarget.clone();
    let spin = 0;            // rad/s around the screen axis
    let sensorsActive = false;
    let lastShake = 0;
    let flash = 0;
    const pointer = { down: false, x: 0, y: 0 };

    function screenAngle() {
      const a = screen.orientation ? screen.orientation.angle : window.orientation;
      return THREE.MathUtils.degToRad(a || 0);
    }

    // Device frame -> screen frame, so tilt still feels right in landscape.
    function toScreen(dx, dy) {
      const a = screenAngle(), c = Math.cos(a), s = Math.sin(a);
      return [dx * c - dy * s, dx * s + dy * c];
    }

    function onOrientation(e) {
      if (e.beta === null || e.gamma === null) return;
      sensorsActive = true;
      const b = THREE.MathUtils.degToRad(e.beta);
      const gm = THREE.MathUtils.degToRad(e.gamma);
      // Direction of "down" in the device's own coordinates.
      const [sx, sy] = toScreen(Math.cos(b) * Math.sin(gm), -Math.sin(b));
      gTarget.set(sx, sy, -Math.cos(b) * Math.cos(gm));
    }

    function onMotion(e) {
      const r = e.rotationRate;
      if (r && r.alpha !== null) spin = THREE.MathUtils.degToRad(r.alpha);

      let mag = 0;
      const a = e.acceleration;
      if (a && a.x !== null) {
        mag = Math.hypot(a.x, a.y, a.z);
      } else if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x !== null) {
        const ag = e.accelerationIncludingGravity;
        mag = Math.abs(Math.hypot(ag.x, ag.y, ag.z) - 9.81);
      }
      const now = performance.now();
      if (mag > SHAKE_THRESHOLD && now - lastShake > 350) {
        lastShake = now;
        burst(Math.min(mag / SHAKE_THRESHOLD, 2.5));
      }
    }

    function burst(strength) {
      const kick = mode.burst * strength;
      for (let i = 0; i < n * 3; i++) vel[i] += (Math.random() * 2 - 1) * kick;
      if (mode.align) for (let i = 0; i < n; i++) angles[i] += (Math.random() * 2 - 1) * strength;
      if (mode.pop) {
        const share = Math.min(0.6, 0.2 * strength);
        for (let i = 0; i < n; i++) if (Math.random() < share) pop(i);
      }
      flash = Math.min(0.35, 0.15 * strength);
    }

    function pointerToWorld(e) {
      pointer.x = (e.clientX / innerWidth * 2 - 1) * HX;
      pointer.y = -(e.clientY / innerHeight * 2 - 1) * HY;
    }

    const canvas = renderer.domElement;
    canvas.addEventListener('pointerdown', e => { pointer.down = true; pointerToWorld(e); });
    addEventListener('pointerup', () => { pointer.down = false; });
    addEventListener('pointercancel', () => { pointer.down = false; });
    addEventListener('pointermove', e => {
      pointerToWorld(e);
      // Without motion sensors the mouse position stands in for tilt.
      if (!sensorsActive && e.pointerType === 'mouse') {
        gTarget.set(pointer.x / HX, pointer.y / HY, -0.8);
      }
    });
    canvas.addEventListener('dblclick', () => burst(1));
    addEventListener('keydown', e => {
      if (e.code === 'Space') burst(1);
      const idx = MODES.indexOf(mode);
      if (e.key === 'ArrowRight') setMode(MODES[(idx + 1) % MODES.length].id, true);
      if (e.key === 'ArrowLeft') setMode(MODES[(idx + MODES.length - 1) % MODES.length].id, true);
      const digit = parseInt(e.key, 10);
      if (digit >= 1 && digit <= MODES.length) setMode(MODES[digit - 1].id, true);
    });

    // ---- Start: motion permission (iOS needs a tap) --------------------
    async function requestMotion() {
      const asks = [];
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        asks.push(DeviceOrientationEvent.requestPermission());
      }
      if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
        asks.push(DeviceMotionEvent.requestPermission());
      }
      try {
        const results = await Promise.all(asks);
        return results.every(r => r === 'granted');
      } catch {
        return false;
      }
    }

    let wakeLock = null;
    async function keepAwake() {
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { /* not supported */ }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && wakeLock) keepAwake();
    });

    document.getElementById('go').addEventListener('click', async () => {
      const granted = await requestMotion();
      if (granted) {
        addEventListener('deviceorientation', onOrientation);
        addEventListener('devicemotion', onMotion);
      }
      keepAwake();
      document.getElementById('start').classList.add('gone');
      nav.classList.add('show');

      // Give sensors a moment to report before choosing which hints to show.
      setTimeout(() => {
        const hints = document.getElementById('hints');
        const list = sensorsActive
          ? ['Tilt to pour', 'Twist to swirl', 'Shake to scatter', mode.touchHint ?? 'Touch to gather']
          : isTouch
            ? ['Motion access off', mode.touchHint ?? 'Touch to gather']
            : ['Move mouse to tilt', 'Hold to gather', 'Space to scatter', '← → to switch'];
        hints.innerHTML = list.map(t => `<span>${t}</span>`).join('');
        hints.classList.add('show');
        setTimeout(() => hints.classList.remove('show'), 6000);
      }, 800);
    });

    // ---- Simulation ----------------------------------------------------
    // Particles push apart through a coarse density grid: each particle
    // deposits into its 8 neighbouring cells, and over-dense cells push
    // particles down the pressure gradient. Cheap, and it behaves like sand/fluid.
    // With cohesion, under-dense cells pull too, which beads particles into blobs.
    function step(dt) {
      const m = mode;
      const restDensity = n / ((nx - 1) * (ny - 1) * (nz - 1) * m.fill);
      const K = Math.max(Math.abs(m.G), 2) / (0.6 * restDensity);
      const sxy = nx * ny;

      rho.fill(0);
      for (let i = 0; i < n; i++) {
        const p = i * 3;
        const fx = (positions[p] + HX) / CSX, fy = (positions[p + 1] + HY) / CSY, fz = (positions[p + 2] + HZ) / CSZ;
        const ix = Math.min(Math.max(fx | 0, 0), nx - 2);
        const iy = Math.min(Math.max(fy | 0, 0), ny - 2);
        const iz = Math.min(Math.max(fz | 0, 0), nz - 2);
        const tx = Math.min(Math.max(fx - ix, 0), 1), ty = Math.min(Math.max(fy - iy, 0), 1), tz = Math.min(Math.max(fz - iz, 0), 1);
        const c = ix + iy * nx + iz * sxy;
        const ux = 1 - tx, uy = 1 - ty, uz = 1 - tz;
        rho[c] += ux * uy * uz;
        rho[c + 1] += tx * uy * uz;
        rho[c + nx] += ux * ty * uz;
        rho[c + nx + 1] += tx * ty * uz;
        rho[c + sxy] += ux * uy * tz;
        rho[c + sxy + 1] += tx * uy * tz;
        rho[c + sxy + nx] += ux * ty * tz;
        rho[c + sxy + nx + 1] += tx * ty * tz;
      }
      const cohesion = m.cohesion;
      for (let c = 0; c < rho.length; c++) {
        const d = rho[c] * wallBoost[c] - restDensity;
        pressure[c] = (d > 0 ? d : d * cohesion) * K;
      }

      const gx = g.x * m.G, gy = g.y * m.G, gz = g.z * m.G;
      const damp = Math.exp(-m.damp * dt);
      const swirl = -spin * m.swirl;
      const jitter = m.jitter, pull = m.pull, bounce = m.bounce, vortex = m.vortex ?? 2;
      const P = pressure;
      if (m.strand) prev.set(positions.subarray(0, n * 3));

      for (let i = 0; i < n; i++) {
        const p = i * 3;
        let x = positions[p], y = positions[p + 1], z = positions[p + 2];

        // Gradient of the trilinear-interpolated pressure field.
        const fx = (x + HX) / CSX, fy = (y + HY) / CSY, fz = (z + HZ) / CSZ;
        const ix = Math.min(Math.max(fx | 0, 0), nx - 2);
        const iy = Math.min(Math.max(fy | 0, 0), ny - 2);
        const iz = Math.min(Math.max(fz | 0, 0), nz - 2);
        const tx = Math.min(Math.max(fx - ix, 0), 1), ty = Math.min(Math.max(fy - iy, 0), 1), tz = Math.min(Math.max(fz - iz, 0), 1);
        const ux = 1 - tx, uy = 1 - ty, uz = 1 - tz;
        const c = ix + iy * nx + iz * sxy;
        const p000 = P[c], p100 = P[c + 1], p010 = P[c + nx], p110 = P[c + nx + 1];
        const p001 = P[c + sxy], p101 = P[c + sxy + 1], p011 = P[c + sxy + nx], p111 = P[c + sxy + nx + 1];
        const dpx = (uy * uz * (p100 - p000) + ty * uz * (p110 - p010) + uy * tz * (p101 - p001) + ty * tz * (p111 - p011)) / CSX;
        const dpy = (ux * uz * (p010 - p000) + tx * uz * (p110 - p100) + ux * tz * (p011 - p001) + tx * tz * (p111 - p101)) / CSY;
        const dpz = (ux * uy * (p001 - p000) + tx * uy * (p101 - p100) + ux * ty * (p011 - p010) + tx * ty * (p111 - p110)) / CSZ;

        let ax = gx - dpx + swirl * -y;
        let ay = gy - dpy + swirl * x;
        let az = gz - dpz;

        if (jitter) {
          ax += (Math.random() * 2 - 1) * jitter;
          ay += (Math.random() * 2 - 1) * jitter;
          az += (Math.random() * 2 - 1) * jitter;
        }

        if (pointer.down) {
          const dx = pointer.x - x, dy = pointer.y - y;
          const r = Math.hypot(dx, dy) + 0.08;
          ax += (dx * pull - dy * vortex) / r;
          ay += (dy * pull + dx * vortex) / r;
          az -= z * 4;
        }

        let vx = (vel[p] + ax * dt) * damp;
        let vy = (vel[p + 1] + ay * dt) * damp;
        let vz = (vel[p + 2] + az * dt) * damp;

        x += vx * dt; y += vy * dt; z += vz * dt;
        if (x < -HX) { x = -HX; vx = -vx * bounce; } else if (x > HX) { x = HX; vx = -vx * bounce; }
        if (y < -HY) { y = -HY; vy = -vy * bounce; } else if (y > HY) { y = HY; vy = -vy * bounce; }
        if (z < -HZ) { z = -HZ; vz = -vz * bounce; } else if (z > HZ) { z = HZ; vz = -vz * bounce; }

        positions[p] = x; positions[p + 1] = y; positions[p + 2] = z;
        vel[p] = vx; vel[p + 1] = vy; vel[p + 2] = vz;
      }

      if (m.strand) {
        // Position-based dynamics: pull linked points back to their rest spacing,
        // then derive velocity from how far each point actually moved.
        solveStrands(6);
        const inv = 1 / dt;
        for (let i = 0; i < n * 3; i++) vel[i] = (positions[i] - prev[i]) * inv;
      }
    }

    function link(a, b, rest, k) {
      const pa = a * 3, pb = b * 3;
      const dx = positions[pb] - positions[pa], dy = positions[pb + 1] - positions[pa + 1], dz = positions[pb + 2] - positions[pa + 2];
      const d = Math.hypot(dx, dy, dz) || 1e-9;
      const corr = ((d - rest) / d) * k;
      positions[pa] += dx * corr; positions[pa + 1] += dy * corr; positions[pa + 2] += dz * corr;
      positions[pb] -= dx * corr; positions[pb + 1] -= dy * corr; positions[pb + 2] -= dz * corr;
    }

    function solveStrands(iterations) {
      const L = mode.strand, seg = mode.segment, bend = mode.stiffness * 0.5;
      for (let it = 0; it < iterations; it++) {
        for (let base = 0; base < n; base += L) {
          for (let j = 0; j < L - 1; j++) link(base + j, base + j + 1, seg, 0.5);
          // Linking every other point resists sharp kinks without making the strand rigid.
          for (let j = 0; j < L - 2; j++) link(base + j, base + j + 2, seg * 1.9, bend);
        }
        for (let p = 0; p < n * 3; p += 3) {
          positions[p] = Math.min(Math.max(positions[p], -HX), HX);
          positions[p + 1] = Math.min(Math.max(positions[p + 1], -HY), HY);
          positions[p + 2] = Math.min(Math.max(positions[p + 2], -HZ), HZ);
        }
      }
    }

    // Needles turn toward the field of a bar magnet (pointing up the screen) under
    // the finger, faster where the field is stronger (~1/r³). With no magnet they
    // keep their alignment, but filings that are being poured drift toward their
    // direction of travel. Needles have no head or tail, so angles wrap at π.
    function alignNeedles(dt) {
      for (let i = 0; i < n; i++) {
        const p = i * 3;
        let target, rate;
        if (pointer.down) {
          const rx = positions[p] - pointer.x, ry = positions[p + 1] - pointer.y;
          const r = Math.sqrt(rx * rx + ry * ry) + 0.03;
          const ux = rx / r, uy = ry / r;
          target = Math.atan2(3 * uy * uy - 1, 3 * uy * ux);
          rate = 0.05 / (r * r * r);
        } else {
          const vx = vel[p], vy = vel[p + 1];
          const speed = Math.hypot(vx, vy);
          if (speed < 0.05) continue;
          target = Math.atan2(vy, vx);
          rate = speed * 0.5;
        }
        let diff = target - angles[i];
        diff -= Math.PI * Math.round(diff / Math.PI);
        angles[i] += diff * Math.min(1, rate * dt * 10);
      }
      geometry.attributes.aAngle.needsUpdate = true;
    }

    // A popped bubble vanishes and starts again at zero size on the low side of
    // the box (where gravity points), so it rises back into view as it grows.
    function pop(i) {
      const p = i * 3;
      positions[p] = (Math.random() * 2 - 1) * HX;
      positions[p + 1] = (Math.random() * 2 - 1) * HY;
      positions[p + 2] = (Math.random() * 2 - 1) * HZ;
      const ax = Math.abs(g.x), ay = Math.abs(g.y), az = Math.abs(g.z);
      if (ax >= ay && ax >= az) positions[p] = Math.sign(g.x) * HX * 0.95;
      else if (ay >= az) positions[p + 1] = Math.sign(g.y) * HY * 0.95;
      else positions[p + 2] = Math.sign(g.z) * HZ * 0.95;
      vel[p] = vel[p + 1] = vel[p + 2] = 0;
      scales[i] = 0;
    }

    // Touching a bubble pops it; popped bubbles grow back over about a second.
    function updateBubbles(dt) {
      if (pointer.down) {
        const base = mode.size * 0.5;
        for (let i = 0; i < n; i++) {
          if (scales[i] < 0.3) continue;
          const p = i * 3;
          const radius = base * scales[i] * (1 - mode.sizeVar + mode.sizeVar * (0.4 + seeds[i] * 1.2)) + 0.03;
          const dx = positions[p] - pointer.x, dy = positions[p + 1] - pointer.y;
          if (dx * dx + dy * dy < radius * radius) { pop(i); flash = Math.max(flash, 0.05); }
        }
      }
      for (let i = 0; i < n; i++) if (scales[i] < 1) scales[i] = Math.min(1, scales[i] + dt);
      geometry.attributes.aScale.needsUpdate = true;
    }

    // Normalised speed per particle; each mode's shader decides what it looks like.
    function measureSpeeds() {
      const inv = 1 / mode.speedRef;
      for (let i = 0; i < n; i++) {
        const p = i * 3;
        speeds[i] = Math.min(Math.hypot(vel[p], vel[p + 1], vel[p + 2]) * inv, 1);
      }
    }

    // ---- Loop ----------------------------------------------------------
    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 1 / 30);
      last = now;

      g.lerp(gTarget, 1 - Math.exp(-dt * 12));
      spin *= Math.exp(-dt * 4);   // decays if motion events stop
      step(dt / 2);
      step(dt / 2);
      measureSpeeds();
      if (mode.align) alignNeedles(dt);
      if (mode.pop) updateBubbles(dt);

      flash *= Math.exp(-dt * 6);
      uniforms.uFlash.value = flash;
      uniforms.uTime.value = now / 1000;
      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.aSpeed.needsUpdate = true;

      if (mode.trail) {
        renderer.setRenderTarget(trailTarget);
        renderer.clearDepth();
        drawQuad(fadeMaterial, needsClear ? 1 : mode.trail);
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);
        drawQuad(blitMaterial);
      } else {
        renderer.clear();
        renderer.render(scene, camera);
      }
      needsClear = false;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
