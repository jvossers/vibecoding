<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meanwhile — what else was happening?</title>
<meta name="description" content="Compare countries, regions and people side by side on a zoomable timeline of history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap">
<style>
:root { --label-w: 200px; } /* colours and fonts: see the theme block further down */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
body { min-height: 100vh; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #9DBCFA; outline-offset: 2px; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn:hover { background: var(--panel2); }
.icon-btn.ghost { border-color: transparent; background: transparent; }
.btn { height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--panel2); }
a.btn { text-decoration: none; color: var(--text); }
.btn.primary { background: var(--cursor); color: var(--bg); border-color: var(--cursor); font-weight: 600; }
.btn.dashed { border-style: dashed; border-color: var(--line2); background: transparent; }
svg { flex: none; }

/* header */
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin-right: 8px; }
.search { position: relative; flex: 1; max-width: 520px; }
.search label { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--text); font: inherit; font-size: 14px; }
.results { position: absolute; z-index: 30; top: 46px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: none; max-height: 60vh; overflow: auto; }
.results.open { display: block; }
.results button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 14px; }
.results button:hover, .results button.active { background: var(--panel2); }
.results .meta { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.results .head { font-size: 11px; letter-spacing: .08em; color: var(--dim); padding: 8px 10px 4px; }
.spacer { flex: 1; }
.zoom { display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.zoom .icon-btn { border: 0; background: transparent; width: 34px; height: 32px; }
.zoom span { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 86px; text-align: center; }

/* toolbar */
.toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 20px 8px; flex-wrap: wrap; }
.toolbar .range { font-family: var(--mono); font-size: 14px; }
.presets { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.presets button { height: 28px; padding: 0 11px; border: 0; border-radius: 6px; font-size: 12px; cursor: pointer; background: transparent; color: var(--soft); }
.presets button[aria-pressed="true"] { background: var(--cursor); color: var(--bg); }

/* main layout */
main { flex: 1; display: flex; min-height: 0; }
.workspace { flex: 1; min-width: 0; padding: 0 20px 20px; }

/* timeline */
.timeline { position: relative; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
.ruler-row { display: flex; height: 36px; position: sticky; top: 0; z-index: 5; background: var(--bg); }
.ruler-row .lab { width: var(--label-w); flex: none; font-size: 11px; letter-spacing: .08em; color: var(--dim); padding-top: 12px; }
.ruler { position: relative; flex: 1; border-bottom: 1px solid var(--line); cursor: crosshair; overflow: hidden; }
.tick { position: absolute; bottom: 0; border-left: 1px solid var(--line2); }
.tick-label { position: absolute; top: 8px; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.overlay { position: absolute; top: 0; bottom: 0; pointer-events: none; }
.overlay.grid { z-index: 0; }
.overlay.marks { z-index: 6; overflow: hidden; }
.gridline { position: absolute; top: 36px; bottom: 0; border-left: 1px solid var(--grid); }
.cursor-line { position: absolute; top: 0; bottom: 0; border-left: 1.5px solid var(--cursor); }
.cursor-pill { position: absolute; top: 6px; left: 0; transform: translateX(-50%); background: var(--cursor); color: var(--bg); font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
.hover-line { position: absolute; top: 0; bottom: 0; border-left: 1px dashed rgba(242,244,247,.35); display: none; }
.hover-pill { position: absolute; top: 8px; left: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; background: var(--bg); padding: 0 4px; }

.lane { transition: height .2s ease; }
.lane { display: flex; border-bottom: 1px solid var(--line); position: relative; z-index: 1; }
.lane-label { width: var(--label-w); flex: none; padding: 12px 10px 10px 0; display: flex; gap: 6px; }
.lane-label .grip { cursor: grab; color: #4A5563; padding: 2px; border: 0; background: transparent; height: 22px; }
.lane-label .grip:active { cursor: grabbing; }
.lane-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; min-width: 0; }
.lane-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.lane-kind { font-size: 12px; color: var(--muted); margin: 3px 0 0 18px; }
.lane-meta { font-family: var(--mono); font-size: 11px; color: var(--dim); margin: 8px 0 0 18px; }
.rollup { margin: 6px 0 0 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.rollup input { accent-color: var(--cursor); margin: 0; }
.lane-actions { margin-left: auto; display: flex; flex-direction: column; gap: 2px; }
.lane-actions .icon-btn { width: 28px; height: 28px; color: var(--dim); }
.lane.drag-over { box-shadow: inset 0 2px 0 var(--cursor); }
.track { position: relative; flex: 1; overflow: hidden; cursor: grab; }
.track.dragging, .timeline.dragging .track { cursor: grabbing; }
.era, .ev-dot, .ev-stem, .ev-label { left: 0; will-change: transform; }
.era { position: absolute; height: 17px; border-radius: 4px; font-size: 11px; line-height: 15px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid; cursor: pointer; text-align: left; }
.era.tiny { color: transparent !important; }
.pts { position: absolute; inset: 0; transition: transform .2s ease; pointer-events: none; }
.pts > * { pointer-events: auto; }
.era.rolled { border-style: dashed; }
.era.sel { box-shadow: 0 0 0 2px var(--cursor); }
.ev-dot { position: absolute; width: 11px; height: 11px; padding: 0; border-radius: 50%; border: 2px solid var(--bg); cursor: pointer; }
.ev-dot.rolled { background: var(--bg) !important; border-width: 2px; border-style: solid; }
.ev-dot.sel { box-shadow: 0 0 0 3px var(--cursor); }
.ev-stem { position: absolute; width: 0; border-left: 1px solid; opacity: .45; pointer-events: none; }
.ev-label { position: absolute; height: 16px; padding: 0 3px; border: 0; border-radius: 3px; background: transparent; color: #D7DCE2; font-size: 11px; line-height: 16px; white-space: nowrap; cursor: pointer; }
.ev-label:hover { background: var(--panel2); }
.ev-label.rolled { color: var(--muted); }
.ev-label.sel { background: var(--cursor); color: var(--bg); }
.mobile-name { display: none; }

.empty { padding: 48px 0; text-align: center; color: var(--muted); }

/* meanwhile */
.meanwhile { margin-top: 18px; }
.meanwhile h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.meanwhile h2 .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.mono { font-family: var(--mono); font-weight: 500; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.card-ongoing { font-size: 12px; color: var(--muted); margin: 5px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card button { display: flex; width: 100%; gap: 8px; align-items: baseline; padding: 4px 0; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 13px; min-width: 0; }
.card button:hover .t { text-decoration: underline; }
.rel { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: none; width: 82px; }
.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .none { font-size: 13px; color: var(--dim); padding: 4px 0; }

/* minimap */
.minimap-row { display: flex; margin-top: 18px; }
.minimap-row .lab { width: var(--label-w); flex: none; font-size: 11px; letter-spacing: .08em; color: var(--dim); padding-top: 6px; }
.minimap-row .lab div { letter-spacing: 0; font-size: 12px; color: var(--muted); margin-top: 4px; font-family: var(--mono); }
.minimap { position: relative; flex: 1; height: 72px; cursor: pointer; touch-action: none; }
.minimap .bg { position: absolute; left: 0; right: 0; top: 0; height: 46px; background: var(--panel); border-radius: 8px; }
.minimap .bar { position: absolute; bottom: 26px; background: var(--line2); border-radius: 2px 2px 0 0; }
.minimap .brush { position: absolute; top: 0; height: 46px; border: 1.5px solid var(--cursor); border-radius: 6px; background: rgba(242,244,247,.1); min-width: 6px; }
.minimap .mt { position: absolute; top: 52px; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }

/* detail */
.detail { width: 360px; flex: none; background: var(--panel); border-left: 1px solid var(--line); padding: 18px 22px 28px; overflow-y: auto; display: none; position: sticky; top: 0; max-height: 100vh; align-self: flex-start; }
.detail.open { display: block; }
.detail .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line); background: transparent; font-size: 12px; color: var(--soft); cursor: pointer; }
.chip:hover { background: var(--panel2); }
.chip.on { border-color: var(--line2); color: var(--text); cursor: default; }
.detail .date { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 16px; }
.detail h2 { margin: 6px 0 10px; font-size: 22px; line-height: 1.25; font-weight: 600; }
.detail p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--soft); }
.detail .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.detail h3 { margin: 22px 0 6px; font-size: 11px; letter-spacing: .08em; font-weight: 500; color: var(--dim); }
.row { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; width: 100%; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
button.row { cursor: pointer; }
button.row:hover .t { text-decoration: underline; }
.row .dot { width: 8px; height: 8px; transform: translateY(-1px); }
.row .note { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }

/* picker */
dialog { padding: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); width: min(1040px, calc(100vw - 24px)); max-height: none; }
dialog::backdrop { background: rgba(5,8,12,.7); }
.pk { display: flex; flex-direction: column; height: min(780px, calc(100vh - 26px)); }
.pk-head { display: flex; align-items: center; gap: 16px; padding: 14px 18px 14px 22px; border-bottom: 1px solid var(--line); flex: none; }
.pk-head h2 { margin: 0; font-size: 20px; font-weight: 600; white-space: nowrap; }
.pk-search { flex: 1; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: var(--bg); border: 1px solid var(--line2); border-radius: 10px; min-width: 0; }
.pk-search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--text); font: inherit; font-size: 15px; }
.pk-body { flex: 1; display: flex; min-height: 0; }
.pk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 6px; padding: 12px 22px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tabs button { flex: none; height: 32px; padding: 0 13px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--soft); font-size: 13px; cursor: pointer; }
.tabs button:hover { background: var(--panel2); }
.tabs button[aria-selected="true"] { background: var(--cursor); border-color: var(--cursor); color: var(--bg); font-weight: 500; }
.pk-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 28px; }
.pk-sec { margin-top: 18px; }
.pk-sec h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; font-weight: 500; color: var(--dim); text-transform: uppercase; }
.pk-sec h3 .why { letter-spacing: 0; text-transform: none; font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.pk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.pk-card { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 10px 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; text-align: left; width: 100%; min-width: 0; }
.pk-card:hover { background: var(--panel2); border-color: var(--line2); }
.pk-card[aria-pressed="true"] { border-color: #6E9BF5; background: rgba(110,155,245,.10); }
.pk-card .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pk-card .nm { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-card .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.pk-card .add { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; flex: none; color: var(--soft); }
.pk-card[aria-pressed="true"] .add { background: #6E9BF5; border-color: #6E9BF5; color: var(--bg); }
.life { position: relative; height: 4px; background: var(--panel2); border-radius: 2px; margin-top: 6px; }
.life div { position: absolute; top: 0; height: 4px; border-radius: 2px; background: #6B7684; }
.pk-card[aria-pressed="true"] .life div { background: #6E9BF5; }
.pk-combo { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.pk-combo:hover { background: var(--panel2); border-color: var(--line2); }
.pk-combo b { display: block; font-size: 14px; font-weight: 500; }
.pk-combo span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.pk-combo .lanes { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.pk-combo .lanes i { font-style: normal; font-size: 11px; color: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; }
.pk-empty { padding: 32px 0; color: var(--muted); font-size: 14px; }
.pk-empty .tabs { padding: 12px 0 0; border: 0; }
mark { background: rgba(232,197,71,.28); color: inherit; border-radius: 2px; }
.pk-side { width: 280px; flex: none; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; background: #11161C; border-left: 1px solid var(--line); overflow-y: auto; }
.pk-side h3 { margin: 0 0 2px; font-size: 11px; letter-spacing: .08em; font-weight: 500; color: var(--dim); }
.pk-side .hint { font-size: 12px; color: var(--dim); margin: 2px 0 0; }
.mine { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 4px 0 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.mine span.n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mine .icon-btn { width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); }
.pk-chips { display: none; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--cursor); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; }

/* ---------- Bold blocks theme ---------- */
:root {
  --bg: #FBFAF6; --panel: #FFFFFF; --panel2: #F1EEE6; --line: #D9D4C7; --line2: #B9B3A5;
  --text: #111111; --soft: #2B2A27; --muted: #4F4B44; --dim: #6A655C; --grid: #ECE8DE;
  --cursor: #111111; --ink: #111111; --shadow: #111111; --hl: #F5C518; --on-hl: #111111;
  --hover: rgba(17,17,17,.07); --backdrop: rgba(251,250,246,.78);
  --sans: 'Bricolage Grotesque', system-ui, sans-serif;
  --mono: 'Space Mono', ui-monospace, monospace;
  color-scheme: light;
}
html, body { font-family: var(--sans); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #2F63D6; outline-offset: 2px; }
.btn, .icon-btn, .zoom, .presets, .search label, .pk-search { border: 2.5px solid var(--ink); border-radius: 0; background: var(--panel); box-shadow: 3px 3px 0 var(--shadow); }
.btn { font-weight: 700; height: 40px; }
.btn:active, .icon-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn.primary, #add-lane { background: var(--hl); color: var(--on-hl); border-color: var(--ink); }
.btn.dashed { border-style: solid; }
.icon-btn.ghost, .zoom .icon-btn, .lane-actions .icon-btn, .mine .icon-btn, .mobile-name .icon-btn { border: 0; box-shadow: none; background: transparent; }
.dot { border-radius: 0; border: 1.5px solid var(--ink); }
header { border-bottom: 3px solid var(--ink); padding: 14px 24px; }
.logo { font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.03em; }
.search label { height: 44px; }
.results { border: 2.5px solid var(--ink); border-radius: 0; box-shadow: 5px 5px 0 var(--shadow); }
.results button { border-radius: 0; font-weight: 500; }
.results button:hover, .results button.active { background: var(--hover); }
.results .head { font-family: var(--mono); color: var(--dim); }
.zoom { padding: 0; }
.zoom span { font-weight: 700; color: var(--text); }
.toolbar { padding: 14px 24px 10px; }
.toolbar .range { font-size: 20px; font-weight: 700; }
.presets { padding: 0; gap: 0; }
.presets button { height: 34px; border-radius: 0; border-right: 2.5px solid var(--ink); font-weight: 700; text-transform: uppercase; font-size: 12px; color: var(--text); }
.presets button:last-child { border-right: 0; }
.presets button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.workspace { padding: 0 24px 24px; }
.ruler { border-bottom: 3px solid var(--ink); }
.ruler-row .lab, .minimap-row .lab { font-family: var(--mono); font-weight: 700; color: var(--text); }
.tick { border-left: 2px solid var(--ink); }
.tick-label { font-weight: 700; color: var(--text); font-size: 12px; }
.cursor-line { border-left: 3px solid var(--ink); }
.cursor-pill { background: var(--hl); color: var(--on-hl); border: 2.5px solid var(--ink); border-radius: 0; font-weight: 700; top: 4px; }
.hover-line { border-left: 1.5px dashed var(--muted); }
.lane { border-bottom: 2px solid var(--ink); }
.lane-label .grip { color: var(--dim); }
.lane-name .tag { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 2.5px solid var(--ink); padding: 2px 9px; font-size: 15px; font-weight: 800; }
.lane-kind, .lane-meta, .rollup { margin-left: 0; }
.lane-kind { font-weight: 500; margin-top: 7px; }
.rollup input { accent-color: var(--ink); }
.era { height: 21px; border-radius: 0; border: 2px solid var(--ink); font-size: 10.5px; font-weight: 800; line-height: 17px; text-transform: uppercase; letter-spacing: .02em; }
.era.rolled { border-style: dashed; color: var(--text) !important; }
.era.sel { box-shadow: 0 0 0 3px var(--hl); }
.ev-dot { width: 12px; height: 12px; border: 0; border-radius: 0; background: transparent; }
.ev-dot::before { content: ''; position: absolute; inset: 2px; background: var(--ink); border: 2px solid var(--ink); transform: rotate(45deg); }
.ev-dot.rolled { background: transparent !important; border: 0; }
.ev-dot.rolled::before { background: var(--bg); }
.ev-dot.sel { box-shadow: none; }
.ev-dot.sel::before { background: var(--hl); inset: 0; }
.ev-stem { border-left: 1.5px solid var(--ink); opacity: .35; }
.ev-label { color: var(--text); font-size: 12px; font-weight: 700; border-radius: 0; }
.ev-label.rolled { color: var(--muted); font-weight: 500; }
.ev-label:hover { background: var(--hover); }
.ev-label.sel { background: var(--hl); color: var(--on-hl); }

</head>
<body>

<div class="toast" id="toast"></div>

<script>
'use strict';
// ---------- constants ----------
const MIN_Y = -3500, MAX_Y = 2030, MIN_SPAN = 0.25;
const NOW = (() => { const d = new Date(); return d.getFullYear() + d.getMonth() / 12 + (d.getDate() - 1) / 365; })();
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const PALETTE = ['#F2603F', '#2F63D6', '#F5C518', '#3BAA6B', '#B07CE8', '#FF9F1C', '#2EC4C4', '#E85D9C'];
const WORLD_COLOR = '#D9D4C7';
const MAX_ERA_ROWS = 6, MAX_LABEL_ROWS = 4;
const ERA_H = 25, LABEL_H = 17;
const DEFAULT = { lanes: ['world', 'netherlands', 'einstein', 'africa'], from: 1850, to: 1970, at: 1905 };
const COMBOS = [
  { title: 'Netherlands, Einstein & Africa', sub: 'The example from the mockups, 1850–1970', lanes: ['world', 'netherlands', 'einstein', 'africa'], from: 1850, to: 1970, at: 1905 },
  { title: 'Darwin & Lincoln', sub: 'Born on the same day — 12 Feb 1809', lanes: ['darwin', 'lincoln', 'united-kingdom', 'usa'], from: 1800, to: 1890, at: 1809.1 },
  { title: 'Mozart & the American Revolution', sub: 'Vienna and the Thirteen Colonies, 1756–1791', lanes: ['mozart', 'usa', 'france'], from: 1750, to: 1800, at: 1776.5 },
  { title: 'Rome, Han China & Egypt', sub: 'The ancient world side by side', lanes: ['italy', 'china', 'egypt', 'julius-caesar', 'cleopatra'], from: -300, to: 300, at: -44 },
  { title: 'The Cold War', sub: 'USA, USSR, Germany and Cuba', lanes: ['usa', 'russia', 'germany', 'cuba'], from: 1940, to: 1995, at: 1962.8 },
  { title: 'Science vs the arts', sub: 'Two themes across five centuries', lanes: ['science', 'arts', 'europe'], from: 1450, to: 2025, at: 1687 },
  { title: 'Age of revolutions', sub: 'America, France and Haiti', lanes: ['usa', 'france', 'haiti', 'napoleon', 'jefferson'], from: 1765, to: 1830, at: 1789.5 },
  { title: 'Shakespeare & the wider world', sub: 'Elizabethan England, Ming China and the Mughals', lanes: ['shakespeare', 'elizabeth-i', 'china', 'india'], from: 1550, to: 1630, at: 1600 },
  { title: 'Bach, Newton & Peter the Great', sub: 'Three lives around 1700', lanes: ['bach', 'newton', 'peter-the-great', 'netherlands'], from: 1640, to: 1760, at: 1697.5 },
  { title: 'Ibn Battuta’s world', sub: 'Morocco to Mali, India and China', lanes: ['ibn-battuta', 'mansa-musa', 'mali', 'india', 'china'], from: 1280, to: 1380, at: 1330 },
  { title: 'The space age', sub: 'Race to the Moon', lanes: ['armstrong', 'jfk', 'usa', 'russia', 'science'], from: 1955, to: 1975, at: 1969.55 },
  { title: 'Medicine through time', sub: 'From the Black Death to mRNA', lanes: ['medicine', 'science', 'world'], from: 1300, to: 2025, at: 1796.4 },
  { title: 'Cities side by side', sub: 'Amsterdam, London, Paris and New York', lanes: ['amsterdam', 'london', 'paris', 'new-york'], from: 1600, to: 2025, at: 1889 }
];

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function parseDate(s) {
  const m = /^(-?\d+)(?:-(\d\d))?(?:-(\d\d))?$/.exec(s);
  if (!m) return null;
  const y = +m[1], mo = m[2] ? +m[2] : null, d = m[3] ? +m[3] : null;
  return { y, mo, d, n: y + ((mo || 1) - 1) / 12 + ((d || 1) - 1) / 365 };
}
function fmtYear(y) { return y < 0 ? (-y) + ' BCE' : String(y); }
function fmtDate(p, approx) {
  if (!p) return 'today';
  let s = fmtYear(p.y);
  if (p.mo) s = MONTHS[p.mo - 1] + ' ' + s;
  if (p.d) s = p.d + ' ' + s;
  return (approx ? 'c. ' : '') + s;
}
function fmtPoint(y, span) {
  const yr = Math.floor(y);
  if (span > 15) return fmtYear(yr);
  const mo = clamp(Math.floor((y - yr) * 12), 0, 11);
  if (span > 1.5) return MONTHS[mo] + ' ' + fmtYear(yr);
  const day = clamp(Math.floor(((y - yr) * 12 - mo) * 30.4) + 1, 1, 31);
  return day + ' ' + MONTHS[mo] + ' ' + fmtYear(yr);
}
function fmtSpan(span) {
  if (span >= 2) return Math.round(span).toLocaleString('en') + ' years';
  return Math.max(1, Math.round(span * 12)) + ' months';
}
function rel(d) {
  const a = Math.abs(d), dir = d > 0 ? 'later' : 'earlier';
  if (a < 0.02) return 'same week';
  if (a < 0.0833) return 'same month';
  if (a < 1) return Math.round(a * 12) + ' mo ' + dir;
  if (a < 1.5) return '1 yr ' + dir;
  return Math.round(a).toLocaleString('en') + ' yrs ' + dir;
}
function luminance(hex) {
  const v = hex.replace('#', '').slice(0, 6).match(/../g).map((h) => parseInt(h, 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
// black or white, whichever has more contrast on the given colour
function inkOn(hex) { const L = luminance(hex); return (L + 0.05) / 0.0559 >= 1.05 / (L + 0.05) ? '#111111' : '#FFFFFF'; }
let measureCtx;
function textW(s) {
  if (!measureCtx) { measureCtx = document.createElement('canvas').getContext('2d'); }
  measureCtx.font = "700 12px 'Bricolage Grotesque', system-ui, sans-serif";
  return measureCtx.measureText(s).width + 8;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }

// ---------- data ----------
let SCOPES = new Map(), EVENTS = [], EVENT_BY_ID = new Map(), CHILDREN = new Map();
function prepare(data) {
  data.scopes.forEach((s) => { SCOPES.set(s.id, s); CHILDREN.set(s.id, []); });
  data.scopes.forEach((s) => { if (s.parent) CHILDREN.get(s.parent).push(s.id); });
  data.scopes.forEach((s) => {
    const chain = []; let c = s;
    while (c) { chain.push(c.id); c = c.parent ? SCOPES.get(c.parent) : null; }
    s.chain = chain; // self → … → root
    s.depth = chain.length - 1;
  });
  const people = data.scopes.filter((s) => s.type === 'person');
  people.forEach((p) => {
    p.b = parseDate(p.born); p.dd = parseDate(p.died);
    data.events.push({ id: 'life-' + p.id, title: p.name, start: p.born, end: p.died, scopes: [p.id], importance: 1, life: true,
      desc: p.role + ', ' + fmtDate(p.b) + ' – ' + fmtDate(p.dd) + '.' });
  });
  EVENTS = data.events.map((e) => {
    const s = parseDate(e.start), en = e.end ? parseDate(e.end) : null;
    const era = !!(e.end || e.ongoing);
    const ev = Object.assign({}, e, { s, en, y0: s.n, y1: era ? (en ? en.n : NOW) : s.n, era });
    if (era && en && en.n === s.n) ev.y1 = s.n + 1 / 365;
    ev.when = era ? fmtDate(s, e.approx) + ' – ' + (en ? fmtDate(en, e.approx) : 'today') : fmtDate(s, e.approx);
    ev.search = (e.title + ' ' + (e.desc || '')).toLowerCase();
    EVENT_BY_ID.set(ev.id, ev);
    return ev;
  });
  SCOPES.forEach((s) => {
    s.count = 0;
    s.search = [s.name, ...(s.aliases || []), s.role || ''].join(' ').toLowerCase();
  });
  EVENTS.forEach((e) => e.scopes.forEach((id) => { SCOPES.get(id).count++; }));
}
function scopeKind(s) {
  if (s.type === 'person') return s.role + ' · ' + fmtYear(s.b.y) + '–' + fmtYear(s.dd.y);
  if (s.type === 'theme') return 'Theme';
  if (s.type === 'world') return 'Everything, key events';
  const parent = s.parent ? SCOPES.get(s.parent).name + ' › ' : '';
  const t = { continent: 'Continent', region: 'Region', country: 'Country', city: 'City' }[s.type] || s.type;
  return parent ? parent + t : t;
}

// Which events show in a lane: the scope's own events, plus events from child
// scopes (rolled up). The further down the hierarchy, the more important an
// event must be to bubble up, so a continent lane isn't buried in local detail.
const laneCache = new Map();
function laneItems(scopeId, rollup) {
  const key = scopeId + '|' + rollup;
  if (laneCache.has(key)) return laneCache.get(key);
  const out = [];
  for (const e of EVENTS) {
    let best = null;
    for (const sid of e.scopes) {
      const d = SCOPES.get(sid).chain.indexOf(scopeId);
      if (d === 0) { best = { d: 0, via: null }; break; }
      if (d > 0 && rollup && (!best || d < best.d)) best = { d, via: sid };
    }
    if (!best) continue;
    if (best.d === 1 && e.importance > 2) continue;
    if (best.d >= 1 && (e.end || e.ongoing) && (best.d > 1 || e.importance > 1)) continue; // eras roll up only one level, and only the big ones
    if (best.d >= 2 && e.importance > 1) continue;
    out.push({ e, rolled: best.d > 0, via: best.via });
  }
  laneCache.set(key, out);
  return out;
}

// ---------- state ----------
const state = { lanes: [], start: 1850, end: 1970, cursor: 1905, selected: null };
function colorsFor() {
  let k = 0;
  return state.lanes.map((l) => (l.scope === 'world' ? WORLD_COLOR : PALETTE[k++ % PALETTE.length]));
}
// The view animates towards a target range; drags set both at once.
const target = { start: 1850, end: 1970 };
let velocity = 0; // years per frame, for momentum after a drag
function clampRange(s, e) {
  const span = clamp(e - s, MIN_SPAN, MAX_Y - MIN_Y);
  s = clamp(s, MIN_Y, MAX_Y - span);
  return [s, s + span];
}
function setRange(s, e, keepCursor, instant) {
  [s, e] = clampRange(s, e);
  target.start = s; target.end = e;
  velocity = 0;
  if (instant) { state.start = s; state.end = e; }
  if (!keepCursor && (state.cursor < s || state.cursor > e)) { state.cursor = (s + e) / 2; requestRender(); }
  requestView();
}
function zoomAt(anchor, factor) {
  const span = target.end - target.start;
  const ns = clamp(span * factor, MIN_SPAN, MAX_Y - MIN_Y);
  const s = anchor - (anchor - target.start) * (ns / span);
  setRange(s, s + ns, true);
}
function centerOn(y, span) { setRange(y - span / 2, y + span / 2, true); }
function hasLane(id) { return state.lanes.some((l) => l.scope === id); }
function addLane(id) { if (!hasLane(id)) { state.lanes.push({ scope: id, rollup: true }); requestRender(); } }
function removeLane(id) { state.lanes = state.lanes.filter((l) => l.scope !== id); requestRender(); }
function moveLane(from, to) {
  if (from === to || from < 0 || to < 0 || from >= state.lanes.length || to >= state.lanes.length) return;
  const [l] = state.lanes.splice(from, 1); state.lanes.splice(to, 0, l); requestRender();
}
function select(id, moveCursor) {
  state.selected = id;
  const e = EVENT_BY_ID.get(id);

    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), span: state.end - state.start, anchor: yAt((a.x + b.x) / 2) };
    }
  });
  window.addEventListener('pointermove', (ev) => {
    const hover = ev.target.closest && ev.target.closest('#timeline');
    const w = trackWidth(), x = ev.clientX - $('ruler').getBoundingClientRect().left;
    const hl = $('hover-line');
    if (hover && x >= 0 && x <= w && !pts.size) { hl.style.display = 'block'; hl.style.left = x + 'px'; $('hover-pill').textContent = fmtPoint(yAt(ev.clientX), state.end - state.start); }
    else hl.style.display = 'none';
    if (!pts.has(ev.pointerId)) return;
    const prev = pts.get(ev.pointerId);
    pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > 10) {
        const ns = clamp(pinch.span * pinch.d / d, MIN_SPAN, MAX_Y - MIN_Y);
        const r = $('ruler').getBoundingClientRect(), f = ((a.x + b.x) / 2 - r.left) / r.width;
        setRange(pinch.anchor - f * ns, pinch.anchor + (1 - f) * ns, true, true);
      }
      dragMoved = true;
      return;
    }
    const dx = ev.clientX - prev.x;
    if (!dragMoved && Math.abs(ev.clientX - last.x) < 5 && Math.abs(ev.clientY - last.y) < 5) return;
    if (!dragMoved && ev.pointerType === 'touch' && Math.abs(ev.clientY - last.y) > Math.abs(ev.clientX - last.x)) { pts.delete(ev.pointerId); return; }
    if (!dragMoved) { dragMoved = true; tl.classList.add('dragging'); try { tl.setPointerCapture(ev.pointerId); } catch (_) {} }
    const d = -dx / w * (state.end - state.start), now = performance.now();
    setRange(state.start + d, state.end + d, true, true);
    // smoothed speed in years per 60fps frame, for momentum on release
    const dt = Math.max(1, now - (last.time || now - 16));
    last.v = 0.6 * (d / dt * 16.7) + 0.4 * (last.v || 0); last.time = now;
  });
  const up = (ev) => {
    if (!pts.has(ev.pointerId)) return;
    pts.delete(ev.pointerId);
    if (pts.size < 2) pinch = null;
    if (!pts.size) {
      tl.classList.remove('dragging');
      if (dragMoved && !pinch && last && last.v && performance.now() - last.time < 80) { velocity = last.v; requestView(); }
      if (!dragMoved && last && !last.t.closest('[data-id]') && !last.t.closest('button')) {
        state.cursor = yAt(ev.clientX); requestRender();
      }
      setTimeout(() => { dragMoved = false; }, 0);
    }
  };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  tl.addEventListener('pointerleave', () => { $('hover-line').style.display = 'none'; });

  // minimap: click or drag the brush
  const mm = $('minimap');
  let mmDown = false;
  const mmMove = (ev) => {
    const r = mm.getBoundingClientRect(), { lo, hi } = mini;
    const y = lo + (ev.clientX - r.left) / r.width * (hi - lo), span = state.end - state.start;
    setRange(y - span / 2, y + span / 2, false, true);
  };
  mm.addEventListener('pointerdown', (ev) => { mmDown = true; mm.setPointerCapture(ev.pointerId); mmMove(ev); });
  mm.addEventListener('pointermove', (ev) => { if (mmDown) mmMove(ev); });
  mm.addEventListener('pointerup', () => { mmDown = false; });

  // keyboard
  window.addEventListener('keydown', (ev) => {
    if (ev.target.closest('input, dialog')) return;
    const s = state.end - state.start;
    if (ev.key === 'ArrowLeft') { setRange(target.start - s / 10, target.end - s / 10, true); ev.preventDefault(); }
    else if (ev.key === 'ArrowRight') { setRange(target.start + s / 10, target.end + s / 10, true); ev.preventDefault(); }
    else if (ev.key === '+' || ev.key === '=') $('zoom-in').click();
    else if (ev.key === '-' || ev.key === '_') $('zoom-out').click();
    else if (ev.key === 'Escape' && state.selected) { state.selected = null; requestRender(); }
    else if (ev.key === '/') { ev.preventDefault(); $('search-input').focus(); }
  });

  // search
  $('search-input').addEventListener('input', runSearch);
  $('search-input').addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      searchSel = clamp(searchSel + (ev.key === 'ArrowDown' ? 1 : -1), 0, searchItems.length - 1);
      document.querySelectorAll('#search-results [data-si]').forEach((b) => b.classList.toggle('active', +b.dataset.si === searchSel));
    } else if (ev.key === 'Enter') { pickSearch(searchSel); }
    else if (ev.key === 'Escape') { $('search-results').classList.remove('open'); }
  });

  // picker
  $('pk-close').onclick = $('pk-done').onclick = () => $('picker').close();
  $('picker').addEventListener('click', (ev) => {
    if (ev.target === $('picker')) { $('picker').close(); return; }
    const tog = ev.target.closest('[data-toggle]');
    if (tog) { const id = tog.dataset.toggle; if (hasLane(id)) removeLane(id); else addLane(id); renderPicker(); return; }
    const tab = ev.target.closest('[data-tab]'); if (tab) { pkTab = tab.dataset.tab; $('pk-search').value = ''; $('pk-list').scrollTop = 0; renderPicker(); return; }
    const up = ev.target.closest('[data-up]'); if (up) { moveLane(+up.dataset.up, +up.dataset.up - 1); renderPicker(); return; }
    const dn = ev.target.closest('[data-down]'); if (dn) { moveLane(+dn.dataset.down, +dn.dataset.down + 1); renderPicker(); return; }
    const c = ev.target.closest('[data-combo]'); if (c) { applyCombo(COMBOS[+c.dataset.combo]); $('picker').close(); }
  });
  $('pk-search').addEventListener('input', () => { $('pk-list').scrollTop = 0; renderPicker(); });
  $('pk-search').addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { const first = $('pk-list').querySelector('[data-toggle]'); if (first) first.click(); }
  });

  window.addEventListener('resize', requestRender);
  window.addEventListener('hashchange', () => { readHash(); requestRender(); });
  window.addEventListener('resize', () => { built.sig = ''; });
}

// ---------- boot ----------
fetch('data.json').then((r) => r.json()).then((data) => {
  prepare(data);
  readHash();
  bind();
  requestRender();
  document.fonts && document.fonts.ready.then(requestRender);
}).catch((err) => {
  $('lanes').innerHTML = '<div class="empty">Could not load data.json. Serve this folder over http (e.g. <code>python3 -m http.server</code>).</div>';
  console.error(err);
});
</script>
</body>
</html>
