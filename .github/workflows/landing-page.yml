# Rebuilds the root index.html whenever main changes, so new project folders
# appear on labs.vossers.com even if nobody ran the build script.
name: Landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node _landing/build.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild landing page"
            git push
          fi
