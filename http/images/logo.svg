<?xml version="1.0" encoding="UTF-8"?>
<!-- An SVG is a picture made of text. Open this file in a text editor and you
     can read every shape. The browser still fetches it with its own HTTP
     request, exactly like a PNG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120">
  <rect x="0" y="0" width="240" height="120" fill="#f4f1e8"/>

  <!-- the client -->
  <rect x="14" y="34" width="52" height="40" rx="4" fill="#24408e"/>
  <rect x="22" y="42" width="36" height="20" fill="#cdd8f5"/>
  <text x="40" y="90" font-family="Georgia, serif" font-size="11" fill="#1c1c1c" text-anchor="middle">client</text>

  <!-- request arrow -->
  <line x1="72" y1="46" x2="162" y2="46" stroke="#1c1c1c" stroke-width="2"/>
  <polygon points="170,46 158,41 158,51" fill="#1c1c1c"/>
  <text x="120" y="38" font-family="Georgia, serif" font-size="11" fill="#1c1c1c" text-anchor="middle">GET</text>

  <!-- response arrow -->
  <line x1="168" y1="64" x2="78" y2="64" stroke="#b7791f" stroke-width="2"/>
  <polygon points="70,64 82,59 82,69" fill="#b7791f"/>
  <text x="120" y="78" font-family="Georgia, serif" font-size="11" fill="#b7791f" text-anchor="middle">200 OK</text>

  <!-- the server -->
  <rect x="174" y="30" width="46" height="48" rx="4" fill="#2f6b3a"/>
  <line x1="180" y1="42" x2="214" y2="42" stroke="#cfe6d4" stroke-width="3"/>
  <line x1="180" y1="54" x2="214" y2="54" stroke="#cfe6d4" stroke-width="3"/>
  <line x1="180" y1="66" x2="214" y2="66" stroke="#cfe6d4" stroke-width="3"/>
  <text x="197" y="94" font-family="Georgia, serif" font-size="11" fill="#1c1c1c" text-anchor="middle">server</text>
</svg>
